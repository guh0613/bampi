services:
  napcat2:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat2
    restart: always
    network_mode: bridge
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NAPCAT_UID=${NAPCAT_UID}
      - NAPCAT_GID=${NAPCAT_GID}
    ports:
      - "3003:3000"
      - "3004:3001"
      - "6111:6099"
    volumes:
      - ./app/.config/QQ:/app/.config/QQ
      - ./app/napcat/config:/app/napcat/config

  bampi-sandbox:
    build:
      context: .
      dockerfile: docker/bampi-sandbox/Dockerfile
    container_name: bampi-sandbox
    restart: unless-stopped
    init: true
    stdin_open: true
    tty: true
    working_dir: /workspace
    environment:
      HOME: /home/bampi
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    command:
      - bash
      - -lc
      - mkdir -p /home/bampi /workspace/inbox /workspace/outbox && exec sleep infinity
    ports:
      - "${BAMPI_SERVICE_PORT_RANGE:-46000-46031}:${BAMPI_SERVICE_PORT_RANGE:-46000-46031}/tcp"
    volumes:
      - ./data/bampi/workspace:/workspace
      - ./data/bampi/agently-cli:/home/bampi/.agently-cli
    tmpfs:
      - /tmp:exec,mode=1777
    healthcheck:
      test: ["CMD", "bampi-sandbox-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
